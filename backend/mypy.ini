[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

# Exclude test files from strict checking
exclude = ^tests/

# Per-module settings
[mypy-app.models.*]
# SQLAlchemy models have dynamic attributes
disallow_untyped_defs = False

[mypy-app.repositories.*]
# Repository layer uses SQLAlchemy queries
disallow_untyped_defs = False

[mypy-app.services.*]
# Service layer is complex, allow gradual typing
disallow_untyped_defs = False

[mypy-app.builders.*]
# Builders use SQLAlchemy expressions
disallow_untyped_defs = False
