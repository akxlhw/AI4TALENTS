[pytest]
# Pytest configuration for Academic Talent System MVP v1.1

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Markers
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
    e2e: mark test as end-to-end test
    slow: mark test as slow running

# Output options
addopts = -v --tb=short --strict-markers -m "not slow"

# Logging
log_cli = false
log_cli_level = INFO

# Coverage (when using --cov)
[coverage:run]
source = app
omit =
    app/main.py
    app/core/config.py
    */tests/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    @abstractmethod
