[project]
name = "talent-platform-backend"
version = "2.2.0"
description = "智能人才库 - 多维度人才发现平台后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.11.0",
    "pydantic-settings==2.5.2",
    "python-json-logger==2.0.7",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "httpx==0.27.2",
    "aiohttp>=3.9.0",
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "openpyxl==3.1.2",
    "bcrypt==4.2.0",
    "PyJWT==2.9.0",
    "redis[hiredis]==5.2.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "black==24.10.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==4.2.0",
    "types-python-dateutil==2.9.0.20240906",
    "aiosqlite==0.20.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "UP017", # Use datetime.UTC (Python 3.11+ only)
    "UP038", # isinstance X | Y not equivalent in Python 3.11
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "migrations/",
    "tests/",
]

[[tool.mypy.overrides]]
module = "app.models.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.repositories.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.services.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.builders.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
