version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-postgres
    environment:
      POSTGRES_DB: talent_db
      POSTGRES_USER: talent_user
      POSTGRES_PASSWORD: talent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_user -d talent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-network

  # Redis 缓存服务 (可选，生产环境建议启用)
  redis:
    image: redis:7-alpine
    container_name: talent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-network
    profiles:
      - production

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: talent-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://talent_user:talent_password@postgres:5432/talent_db
      - DATABASE_SYNC_URL=postgresql://talent_user:talent_password@postgres:5432/talent_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=false
      - LLM_ENABLED=false
      - LLM_PROVIDER=deepseek
      - LLM_API_KEY=${LLM_API_KEY:-}
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talent-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: talent-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "2012:2012"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - talent-network
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:

networks:
  talent-network:
    driver: bridge
