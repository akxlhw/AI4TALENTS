name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-groups

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: uv run pytest tests/ -v --tb=short

      - name: Run slow tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: uv run pytest tests/ -v --tb=short -m slow

  # Backend linting (mypy)
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --all-groups

      - name: Run mypy gate
        working-directory: ./backend
        run: uv run python scripts/mypy_gate.py
        # The gate uses a baseline file (.mypy_baseline.txt) to track
        # existing errors. New mypy errors will fail the build.
        # To regenerate the baseline after intentional fixes:
        #   python scripts/mypy_gate.py --regenerate

      - name: Run architecture compliance check
        working-directory: ./backend
        run: uv run python scripts/check_architecture.py
        # The gate uses a baseline file (.architecture_baseline.txt) to track
        # existing violations. New cross-layer imports will fail the build.
        # To regenerate the baseline after intentional fixes:
        #   python scripts/check_architecture.py --update-baseline

  # Frontend linting
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit --registry https://registry.npmjs.org

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build
        working-directory: ./frontend
        run: npm run build
